<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kong Agent Webview Test</title>
    <link rel="stylesheet" href="src/platforms/vscode/media/chat.css">
    <style>
        body { padding: 0; margin: 0; background-color: #1e1e1e; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #mock-controls { padding: 10px; background: #333; border-bottom: 1px solid #444; position: sticky; top: 0; z-index: 1000; display: flex; gap: 10px; flex-wrap: wrap; }
        button { cursor: pointer; padding: 4px 8px; }
    </style>
</head>
<body>
    <div id="mock-controls">
        <button onclick="sendUserMessage()">1. Send User Message</button>
        <button onclick="sendThought()">2. Send Thought</button>
        <button onclick="sendToolCall()">3. Send Tool Call</button>
        <button onclick="sendAgentResponse()">4. Send Agent Response</button>
        <button onclick="sendCancel()">5. Click Cancel</button>
    </div>
    <div id="root"></div>
    
    <script>
        // Mock VS Code API
        window.acquireVsCodeApi = () => ({
            postMessage: (msg) => {
                console.log('VSCode PostMessage:', msg);
                if (msg.type === 'prompt') {
                    // Auto-respond with addMessage user
                    setTimeout(() => {
                        window.postMessage({ type: 'addMessage', role: 'user', content: msg.value }, '*');
                    }, 100);
                }
            },
            getState: () => ({}),
            setState: (s) => console.log('VSCode SetState:', s)
        });

        function sendUserMessage() {
            window.postMessage({ type: 'addMessage', role: 'user', content: 'Tell me about Kong' }, '*');
        }

        function sendThought() {
            window.postMessage({ type: 'addMessage', role: 'thought', content: '<thought>I am thinking about Kong architecture...</thought>' }, '*');
        }

        function sendToolCall() {
            window.postMessage({ type: 'addMessage', role: 'toolCall', content: '{"name": "check_status"}' }, '*');
        }

        function sendAgentResponse() {
            window.postMessage({ type: 'addMessage', role: 'agent', content: '<thought>Found info.</thought>Kong is a gateway.' }, '*');
        }

        function sendCancel() {
            // Trigger the UI's internal cancel logic if possible, or just mock the state update
            // In App.tsx, handleCancel is triggered by clicking .cancel-btn
            const btn = document.querySelector('.cancel-btn');
            if (btn) btn.click();
            else console.log('Cancel button not found in UI yet');
        }
    </script>
    <script type="module" src="dist/webview.js"></script>
</body>
</html>
